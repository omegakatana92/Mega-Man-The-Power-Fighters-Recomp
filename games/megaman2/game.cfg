# Mega Man 2: The Power Fighters (Capcom 1996, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Mega Man 2: The Power Fighters
# What the window is called (the name stays the folder the player's settings are kept under)
title = Mega Man 2: The Power Fighters Recomp
id = megaman2
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.megaman2
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `megaman2` is MAME's parent set (USA 960708); the clones (megaman2a, megaman2h, rockman2j) are built
# from the same board but are not accepted here.
rom_set = megaman2
rom_parent = megaman2
rom_name = Mega Man 2: The Power Fighters (USA 960708)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs, three 512 KiB files (1.5 MiB, 16-bit words low byte first).
# graphics: four files side by side make 64-bit words; the set's 12 MiB of graphics sit at 0x800000 in
# the 16 MiB region, so the port fills the leading 8 MiB with blank tiles (MAME's ROM_FILL).
# sound_program: the Z80's ROMs. samples: the QSound chip's (rm2.11m, rm2.12m). key: the board's cipher key.
program = rm2u.03:8ffc2cd1 rm2u.04:bb30083a rm2.05:02ee9efc
graphics = @800000 rm2.14m:9b1f00b4 rm2.16m:c2bb0c24 rm2.18m:12257251 rm2.20m:f9b6e786
sound_program = rm2.01a:d18e7859 rm2.02:c463ece0
samples = rm2.11m:2106174d rm2.12m:546c1636
key = megaman2.key:6828ed6d

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this.
# The maincpu region holds 1.5 MiB in this set.
code_end = 180000
